[[headers]]
  for = "/*"
  [headers.values]
    Vary = "Accept, Accept-Encoding"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Vary = "Accept, Accept-Encoding"

[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false
