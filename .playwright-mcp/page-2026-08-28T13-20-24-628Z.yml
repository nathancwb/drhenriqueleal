      - generic [ref=f21e665]:
        - generic [ref=f21e666]:
          - button "Os procedimentos doem?" [ref=f21e667] [cursor=pointer]
          - generic: Na maioria dos casos, o desconforto é mínimo. Utilizamos anestésicos tópicos e técnicas avançadas de aplicação que tornam os procedimentos bastante confortáveis. A maioria dos pacientes descreve a sensação como leve pressão, sem dor significativa.
        - generic [ref=f21e670]:
          - button "Quanto tempo dura a recuperação?" [ref=f21e671] [cursor=pointer]
          - generic: Os procedimentos são minimamente invasivos. Para Botox e preenchimento, a recuperação é praticamente imediata com leve inchaço por 24-48h. Para Fios de PDO, recomendamos 3-5 dias de cuidados especiais, mas a maioria dos pacientes retorna às atividades em 24 horas.
        - generic [ref=f21e674]:
          - button "Os resultados são permanentes?" [ref=f21e675] [cursor=pointer]
          - generic: "A duração varia conforme o procedimento: Botox dura de 4 a 6 meses, preenchimento de 8 a 18 meses, Fios de PDO estimulam colágeno por até 2 anos, e bioestimuladores têm efeito progressivo que dura até 2-3 anos. Criamos protocolos de manutenção personalizados."
        - generic [ref=f21e678]:
          - button "É seguro fazer harmonização facial?" [ref=f21e679] [cursor=pointer]
          - generic: Sim, quando realizada por profissional qualificado e habilitado. O Dr. Henrique possui dupla formação (Dentista e Biomédico), certificações internacionais e utiliza apenas produtos aprovados pela ANVISA em ambiente clínico controlado. A segurança é prioridade absoluta.
        - generic [ref=f21e682]:
          - button "Fico com o rosto inchado? E hematomas?" [ref=f21e683] [cursor=pointer]
          - generic: Um leve inchaço é esperado nas primeiras 24-48 horas, mas é discreto na maioria dos casos. Hematomas podem ocorrer pontualmente, mas são minimizados com técnica adequada de aplicação e cuidados pré e pós-procedimento que orientamos na consulta.
        - generic [ref=f21e686]:
          - button "A partir de qual idade posso fazer?" [ref=f21e687] [cursor=pointer]
          - generic: A partir dos 25 anos é possível iniciar protocolos preventivos, como Botox para linhas de expressão iniciais e bioestimuladores para manutenção da qualidade da pele. A avaliação personalizada identifica o momento e procedimento ideal para cada paciente.
